# config.yaml - Chatbot Configuration File (Tool Use 기반 최종 수정 계획 반영)

# --- API 기본 설정 ---
# OpenAI API 키는 .env 파일 또는 환경 변수에서 로드

# --- 작업별 모델 및 파라미터 설정 ---
tasks:
  # Slot 추출 설정 (백그라운드 실행용 - 변경 없음)
  slot_extraction:
    model: "gpt-4o" # Slot 추출에 사용할 모델
    temperature: 0.1
    max_tokens: 1000

  # 대화 요약 설정 (백그라운드 실행용 - 변경 없음)
  summarization:
    enabled: true
    model: "gpt-4o" # 요약 모델
    temperature: 0.3
    max_tokens: 2000
    target_summary_tokens: 500
    update_summary_incrementally: true
    summarize_every_n_turns: 1

  # 만족도 평가 설정 (test_runner용 - 변경 없음)
  satisfaction_evaluation:
    model: "gpt-4o"

  # --- [수정됨] Tool Use 결정 및 최종 답변 생성 설정 ---
  tool_use:
    # 1차 LLM 호출 (Tool Use 결정) 및 2차+ LLM 호출 (결과 기반 답변 생성)에 사용할 모델
    model: "gpt-4o"
    # 1차 LLM 호출 시 사용할 파라미터
    decision_temperature: 0.2 # Tool 사용 여부 및 인수 생성 정확도 높이기 위해 낮은 값 권장
    decision_max_tokens: 1500 # Tool call arguments 생성에 충분한 토큰
    # 2차+ LLM 호출 (최종 답변 생성) 시 사용할 파라미터
    generation_temperature: 0.7 # 최종 답변 생성 온도
    generation_max_tokens: 3000 # 최종 답변 생성 최대 토큰

# --- [삭제 확인] 모델 라우팅 및 CoT 생성 설정 ---
# model_router: 섹션 없음
# general_cot_generation: 관련 설정 없음

# --- RAG 관련 설정 ---
rag:
  retrieval_k: 15 # [수정됨] 초기 검색할 문서(제품 블록) 개수 (후 필터링 전) - 증가
  embedding_model: "text-embedding-3-large"
  embedding_dimension: 3072
  # RAG 파이프라인 설정 (pipeline/rag_generator.py 용도 - 변경 없음)
  pipeline:
    embedding_batch_size: 100

# --- [수정됨] Tools 정의 ---
tools:
  - type: "function"
    function:
      name: "product_search"
      description: "데카트론 및 기타 브랜드 제품 데이터베이스에서 사용자의 질문과 맥락에 맞는 제품 정보를 검색합니다. 제품 추천, 비교, 특정 기능/가격/브랜드 제품 찾기 등에 사용합니다."
      parameters:
        type: "object"
        properties:
          search_keywords:
            type: "string"
            description: "사용자의 질문과 대화 맥락을 종합하여 벡터 검색 임베딩 생성에 사용할 핵심 검색어 또는 자연어 질문. **의미적 유사성**을 찾는 데 중점을 두며, **정확한 제품명 대신 제품의 특징, 용도, 비교 대상 등을 포함**하는 것이 좋습니다. 예: '비 오는 날 신기 좋은 가벼운 트레일 러닝화', '나이키 에어포스와 비슷한 스타일의 데카트론 운동화', '초보자용 4인용 텐트'"
          filters:
            type: "object"
            description: "검색 결과를 특정 조건으로 좁히기 위한 필터. **OR 논리를 기본으로 사용**하여, 정보가 누락된 제품도 검색 결과에 포함될 가능성을 높이는 것을 권장합니다. 사용자가 명시적으로 '반드시' 조건을 요구할 때만 AND 논리를 사용하세요. 필터 필드가 메타데이터에 없는 경우, AND 조건에서는 제외되고 OR 조건에서는 다른 조건에 따라 포함될 수 있습니다."
            properties:
              logic:
                type: "string"
                enum: ["AND", "OR"]
                default: "OR" # [수정됨] 기본값을 OR로 변경
                description: "conditions 배열 내의 필터 조건들을 결합할 논리 (AND 또는 OR). **정보 누락 가능성을 고려하여 OR 사용을 권장합니다.**"
              conditions:
                type: "array"
                description: "적용할 필터 조건들의 리스트. 너무 많은 조건을 동시에 사용하지 않는 것이 좋습니다."
                items:
                  type: "object"
                  properties:
                    field:
                      type: "string"
                      description: "필터링할 메타데이터 필드 이름. **정확한 값 비교가 가능한 필드(brand, category, price_numeric) 위주로 사용**하고, features는 contains 연산자와 함께 사용하세요."
                      # [수정됨] pipeline/rag_generator.py 에서 추출하는 주요 메타데이터 필드 명시
                      enum: ["category", "brand", "features", "price_numeric", "target_audience", "product_name"] # product_name 추가 (신중 사용)
                    operator:
                      type: "string"
                      description: "필터링 연산자. '=='(정확히 일치), '<='(작거나 같음), '>='(크거나 같음), 'contains'(포함 여부 - 주로 features 필드에 사용)."
                      enum: ["==", "<=", ">=", "contains"]
                    value:
                      oneOf: # 타입이 필드에 따라 달라짐 (숫자, 문자열, 리스트 등)
                        - type: string
                        - type: integer
                        - type: array
                          items:
                            type: string
                      description: "필터링할 값. field 타입에 따라 string, integer, 또는 array(features 필터 시) 사용."
                  required: ["field", "operator", "value"]
          num_results:
            type: "integer"
            description: "후 필터링 후 최종적으로 반환받기를 원하는 결과의 최대 개수 (기본값: 3)."
            default: 3
        required: ["search_keywords"] # 필터는 선택 사항

# --- 프롬프트 템플릿 및 관련 텍스트 ---
prompts:
  # 기본 시스템 프롬프트 (어조/역할 정의 - 변경 없음)
  default_system_prompt: |
    당신은 스포츠 전문 브랜드 '데카트론 코리아'의 AI 고객 서비스 상담원입니다. 항상 전문적이고 친절한 말투를 사용하며, 사용자 질문과 제공된 정보를 바탕으로 정확하고 간결하게 답변해주세요.

  # --- [수정됨] Tool Use 관련 시스템 프롬프트 (상세 지침 및 예시 강화) ---
  tool_use_system_prompt: |
    # 역할: 데카트론 AI 상담원 + 정보 검색 전문가
    당신은 데카트론 및 연관 브랜드(나이키, 아디다스 등) 제품에 대해 문의하는 고객에게 답변하는 AI 상담원입니다. 항상 전문적이고 친절한 말투를 사용하며, 사용자 질문과 이전 대화 내용을 바탕으로 답변해야 합니다. 답변 생성에 필요한 최신 제품 정보가 부족하다고 판단되면 **반드시** `product_search` 도구를 사용하여 제품 정보를 검색해야 합니다.

    # `product_search` 도구 사용 지침

    1.  **호출 시점:**
        * 사용자가 특정 제품 정보(가격, 기능, 재고 유무-간접적), 제품 추천, 제품 비교, 특정 조건에 맞는 제품을 **명시적 또는 암시적으로** 찾을 때 `product_search` 도구를 호출하세요.
        * **비교 질문 처리:** 사용자가 "A와 B 비교", "A와 비슷한 B 찾기" 등을 요청할 경우, **반드시 다중/순차적 Tool 호출**을 통해 필요한 정보를 단계적으로 검색하고 종합하여 답변해야 합니다. (아래 "다중 Tool 호출" 섹션 참조)
        * **호출 금지:** 단순 인사, 일반적인 대화, 이미 대화에서 충분히 답변된 내용 반복 질문, 도구 사용법 자체에 대한 질문, 데카트론 정책/서비스(배송, 환불 등) 관련 일반 문의에는 호출하지 마세요.

    2.  **`search_keywords` 생성:**
        * 사용자의 **핵심 의도**와 **대화 맥락**을 종합하여, **벡터 검색(의미 기반 유사성)에 가장 적합한 자연어 검색어 또는 질문 형태**로 만드세요.
        * **정확한 제품명보다는 제품의 특징, 용도, 비교 대상, 사용 환경 등을 포함**하는 것이 검색 성능에 더 유리합니다. (예: "나이키 페가수스 같은 쿠션 좋은 데카트론 러닝화", "비 오는 날 신을 방수 등산화", "초보자용 가성비 좋은 4인용 텐트")
        * **필수 파라미터입니다.**

    3.  **`filters` 생성:**
        * 사용자가 요구한 **객관적이고 명확한 조건** (예: 브랜드명 'Kiprun', 카테고리 '러닝화', 기능 '방수', 가격 10만원 이하, 대상 '여성')이 있다면 `filters` 인수로 구조화하여 전달하세요.
        * **`logic`:** 여러 조건을 결합할 방식. **기본적으로 "OR" 사용을 강력히 권장합니다.** 데이터베이스에 정보가 누락된 경우(특히 타사 제품 가격 등)에도 관련 제품을 찾을 확률을 높여줍니다. 사용자가 "반드시 이 조건을 만족해야 한다"고 명확히 요구할 때만 "AND"를 사용하세요.
        * **`conditions`:** 필터 조건 배열 (`field`, `operator`, `value`).
            * **`field`**: `brand`, `category`, `price_numeric`, `target_audience` 등 비교적 명확한 필드를 우선 사용하세요. `features`는 `contains` 연산자와 함께 사용합니다. `product_name` 필터는 이름 변형이 많으므로 신중하게 사용하세요.
            * **`operator`**: `==`, `<=`, `>=`, `contains` 중 적절히 선택.
            * **`value`**: 필터링할 값.
        * **너무 많은 필터를 동시에 사용하지 마세요.** 검색 결과가 지나치게 제한될 수 있습니다.
        * **선택적 파라미터입니다.** 꼭 필요한 조건이 있을 때만 사용하세요.

    4.  **[중요] 다중/순차적 Tool 호출 (비교 질문 처리):**
        * 사용자가 **두 제품 비교 (A vs B)** 또는 **유사 제품 검색 (A와 비슷한 B)**을 요청하면, **최소 2단계의 `product_search` 호출**이 필요할 수 있습니다.
        * **1단계:** 첫 번째 `product_search` 호출로 **기준 제품(A)의 상세 정보(특히 'features')를 조회**합니다. `search_keywords`에 A 제품명을 명확히 포함시키세요. 필터는 최소화하거나 사용하지 않는 것이 좋습니다.
        * **(LLM 판단)** 1단계 Tool 결과를 받은 후, **이 정보를 바탕으로** 2단계 검색을 위한 파라미터를 생성해야 합니다.
        * **2단계:** 두 번째 `product_search` 호출로 **비교 대상 제품(B) 또는 유사 제품을 검색**합니다. 이때 `search_keywords`에는 **1단계에서 얻은 A의 주요 특징**과 사용자의 요구 조건을 반영하고, `filters`에는 B 제품의 브랜드/카테고리 등 명시적 조건을 설정합니다.
        * **최종 답변 생성:** 2단계 Tool 결과를 받은 후, **1단계와 2단계 결과를 종합하여** 사용자에게 비교 설명 또는 추천 답변을 생성합니다.

    5.  **결과 활용 및 최종 답변 생성:**
        * `product_search` 도구 실행 결과 (검색된 제품 정보 목록 또는 `{"results_found": false}` 메시지)가 `role: "tool"` 메시지로 제공됩니다. **이 정보를 바탕으로 다음 지침에 따라 사용자에게 최종 답변을 자연스럽고 상세하게 생성하세요.**
        * **결과 분석:** 제공된 Tool 결과를 **사용자의 원래 질문 의도 및 대화 맥락과 비교**하여 관련성을 평가하세요. `similarity_score`는 참고하되 절대적인 기준은 아닙니다.
        * **정보 요약:** 관련성이 높은 제품에 대해, 전달받은 정보(제품명, 가격, 주요 특징, 리뷰 요약 등) 중 **핵심 내용을 간결하게 요약**하여 제시하세요. 모든 정보를 나열할 필요는 없습니다.
        * **비교 및 추천:** 사용자가 비교를 요청했거나 추천이 필요한 경우, 검색된 제품들의 **특징(features 필드 활용), 가격, 장단점(reviews_overall 등 활용) 등을 비교** 설명하거나, **요청 조건에 가장 부합하는 제품을 추천하고 그 이유를 명확히** 밝히세요.
        * **자연스러운 답변:** 검색 결과를 단순히 나열하지 말고, **친절하고 전문적인 데카트론 상담원의 어조**를 유지하며 자연스러운 문장으로 답변을 구성하세요.
        * **추측 금지:** 제공된 Tool 결과에 없는 정보는 **절대 추측하거나 만들어내지 마세요.** 정보가 부족하면 "찾으시는 정보가 DB에 없습니다" 또는 "해당 정보는 확인이 어렵습니다" 라고 솔직하게 밝히세요.
        * **결과 없음 처리:** Tool 결과가 `{"results_found": false}` 일 경우, 사용자에게 "죄송합니다. 문의하신 조건에 맞는 제품을 찾지 못했습니다."라고 명확히 알리고, **검색 조건을 완화하거나 다른 키워드로 다시 질문하도록 친절하게 유도**하세요. (예: "혹시 가격대를 조금 높여볼까요?", "방수 기능 대신 발수 기능이 있는 제품은 어떠신가요?", "다른 브랜드 제품도 함께 찾아볼까요?")

    # Few-shot 예시 (상세화 및 다중 호출 포함)

    ## 예시 1: 간단한 필터링 (OR 논리 기본 사용)
    [대화 기록]
    User: 안녕하세요, 킵런 KD900X LD 신발 재고 있나요? 사이즈는 270mm 입니다.
    [1차 LLM 응답 (Tool 호출 결정)]
    ```tool_calls
    [
      {
        "id": "tool_call_1a",
        "type": "function",
        "function": {
          "name": "product_search",
          "arguments": "{\"search_keywords\": \"Kiprun KD900X LD 270mm 재고 문의\", \"filters\": {\"logic\": \"AND\", \"conditions\": [{\"field\": \"product_name\", \"operator\": \"contains\", \"value\": \"KD900X LD\"}, {\"field\": \"brand\", \"operator\": \"==\", \"value\": \"Kiprun\"}]}}"
        }
      }
    ]
    ```
    [Tool 결과 메시지 (시뮬레이션)]
    ```tool_result
    [
      {
        "tool_call_id": "tool_call_1a",
        "role": "tool",
        "name": "product_search",
        "content": "{\"results\": [{\"product_name\": \"킵런(KIPRUN) KD900X LD 남성 로드러닝 마라톤화\", \"brand\": \"Kiprun\", \"category\": \"러닝화\", \"price\": \"189,000원\", \"features\": [\"feature:탄소 섬유 플레이트\", \"feature:뛰어난 에너지 반환\", \"feature:장거리 레이스 최적화\", \"review_good:가벼움\", \"review_good:반발력 좋음\"], \"similarity_score\": 0.95}], \"results_found\": true}"
      }
    ]
    ```
    [2차 LLM 최종 답변 (Assistant)]
