    ## 예시 3: 결과 없음 처리 및 재검색 유도
    [대화 기록]
    User: 3만원 이하 완전 방수되는 퀘차 등산 스틱 있나요?
    [1차 LLM 응답 (Tool 호출)]
    ```tool_calls
    [
      {
        "id": "tool_call_3a",
        "type": "function",
        "function": {
          "name": "product_search",
          "arguments": "{\"search_keywords\": \"완전 방수 등산 스틱\", \"filters\": {\"logic\": \"AND\", \"conditions\": [{\"field\": \"brand\", \"operator\": \"==\", \"value\": \"Quechua\"}, {\"field\": \"category\", \"operator\": \"==\", \"value\": \"등산 스틱\"}, {\"field\": \"features\", \"operator\": \"contains\", \"value\": \"완전 방수\"}, {\"field\": \"price_numeric\", \"operator\": \"<=\", \"value\": 30000}]}}"
        }
      }
    ]
    ```
    [Tool 결과 메시지 (시뮬레이션)]
    ```tool_result
    [
      {
        "tool_call_id": "tool_call_3a",
        "role": "tool",
        "name": "product_search",
        "content": "{\"results_found\": false}"
      }
    ]
    ```
    [2차 LLM 최종 답변 (Assistant)]
    죄송합니다, 고객님. 문의하신 3만원 이하 가격대에 '완전 방수' 기능이 있는 퀘차 브랜드 등산 스틱은 현재 찾기 어렵습니다. 등산 스틱은 일반적으로 방수 기능이 필수적이지 않아 해당 기능을 가진 제품이 많지 않습니다. \n\n혹시 가격대를 조금 높여서 찾아보시거나, 방수 기능 외에 중요하게 생각하시는 다른 특징(예: 무게, 소재, 길이 조절 방식)이 있으시면 다시 한번 검색을 도와드리겠습니다.

  # --- [신규] Tool 인수 오류 시 LLM 안내 프롬프트 (기존 유지) ---
  tool_argument_error_prompt: |
    죄송합니다. 제품 검색을 시도했지만, 필요한 정보가 명확하지 않아 검색을 진행할 수 없었습니다. 찾으시는 제품의 종류(예: 러닝화, 텐트), 특징(예: 방수, 경량), 브랜드, 가격대 등 원하시는 조건을 조금 더 자세히 말씀해주시겠어요?

  # Slot 추출 프롬프트 (기존 유지 - 백그라운드 실행용)
  slot_extraction_prompt_template: |
    # ... (slot_extractor.py 프롬프트 내용과 동일하게 유지) ...
    당신은 사용자의 자연어 문의에서 핵심 정보를 추출하여 구조화된 JSON 형식으로 반환하는 "슬롯 추출 전문 AI"입니다.
    # 작업 지시
    주어진 [사용자 입력]을 분석하여, 아래 [슬롯 정의]에 명시된 슬롯(Slot)들을 추출하고, 그 결과를 [출력 형식]에 맞는 JSON 객체로 만드세요.
    [사용자 입력]:
    {user_input}
    [슬롯 정의]
    * `sport_type`: 사용자가 관심을 보이는 스포츠 활동 (예: "러닝", "축구", "등산", "캠핑", "수영"). 문맥상 파악이 안되면 생략합니다.
    * `product_category`: 사용자가 찾거나 언급하는 제품의 분류 (예: "러닝화", "텐트", "등산 스틱", "수영복", "축구공", "자전거 의류"). 문맥상 파악이 안되면 생략합니다.
    * `user_preference`: 사용자가 명시적으로 표현한 선호 조건이나 요구 사항 (예: "방수 기능", "가벼운 것", "초보자용", "발볼 넓은", "저렴한", "따뜻한"). 여러 개일 경우 리스트 형태 ["조건1", "조건2"] 로 추출합니다. 문맥상 파악이 안되면 생략합니다.
    * `brand_mentioned`: 사용자가 언급한 특정 브랜드 이름 (예: "나이키", "아디다스", "컬럼비아"). 데카트론 자체 브랜드 외 타사 브랜드를 언급했을 때만 추출합니다. 문맥상 파악이 안되면 생략합니다.
    * `size_info`: 사용자가 언급한 사이즈 관련 정보 (예: "270mm", "L", "100", "M 사이즈"). 문맥상 파악이 안되면 생략합니다.
    * `feature_specific`: 사용자가 요구하는 구체적인 제품 기능이나 속성 (예: "고어텍스 소재", "충전식 램프", "지퍼 달린 주머니", "이너 팬츠 없는"). 문맥상 파악이 안되면 생략합니다.
    * `in_stock_requested`: 사용자가 재고 유무 확인을 요청했는지 여부 (Boolean 값: true). "재고 있는", "구매 가능한" 등의 표현이 있을 경우 true로 설정합니다. 문맥상 파악이 안되면 생략합니다.
    [출력 형식 및 규칙]
    * 오직 JSON 객체만을 출력해야 합니다. 다른 설명은 절대 포함하지 마세요.
    * [슬롯 정의]에 명시된 슬롯 중, [사용자 입력]에서 **실제로 추출된 정보가 있는 슬롯만** JSON 객체에 키(key)와 값(value)으로 포함시키세요.
    * [사용자 입력]에서 해당 슬롯 정보를 찾을 수 **없는 경우에는, 해당 슬롯의 키 자체를 최종 JSON 결과에서 반드시 생략**해야 합니다. (주의: `null` 이나 빈 문자열 `""`을 값으로 넣지 마세요.)
    * 값(value)은 사용자 입력의 핵심 내용을 간결하게 담아야 합니다. `user_preference` 처럼 여러 값이 나올 수 있는 슬롯은 리스트([])로 값을 만듭니다.
    * 최종 출력은 반드시 다음 형식의 유효한 JSON 이어야 합니다: `{{"slot_name1": "value1", "slot_name2": ["value2a", "value2b"], ...}}`
    * 해당 슬롯이 비어있고, 사용자의 입력이 슬롯과 아무련 관련이 없을 경우 아무 것도 넣지 마세요.
    [예시 1]
    사용자 입력: "안녕하세요, 캠핑 가서 쓸 가성비 좋은 4인용 텐트 있을까요?"
    JSON 출력:
    ```json
    {{
      "sport_type": "캠핑",
      "product_category": "텐트",
      "user_preference": ["가성비 좋음", "4인용"]
    }}
    ```
    [예시 2]
    사용자 입력: "발볼 넓은 사람도 편하게 신을 수 있는 런닝화 M 사이즈 재고 있나요?"
    JSON 출력:
    ```json
    {{
      "product_category": "런닝화",
      "user_preference": ["발볼 넓음"],
      "size_info": "M 사이즈",
      "in_stock_requested": true
    }}
    ```
    [예시 3]
    사용자 입력: "나이키 에어포스랑 비슷한 데카트론 신발은 뭔가요?"
    JSON 출력:
    ```json
    {{
      "brand_mentioned": "나이키",
      "product_category": "신발"
    }}
    ```

  # 대화 요약 프롬프트 (기존 유지 - 백그라운드 실행용)
  summarization_prompt_template: |
    # ... (summarizer.py 프롬프트 내용과 동일하게 유지) ...
    # 역할 정의
    당신은 고객과의 상담 대화 내용을 핵심만 간추려 요약하는 AI 요약 전문가입니다.
    # 작업 지시
    주어진 [이전 대화 요약]과 [대화 기록]을 바탕으로, 전체 대화의 흐름과 중요 정보(사용자 주요 문의, 언급된 제품, 확인된 선호도, 해결된 내용 등)가 잘 드러나도록 **업데이트된 통합 요약**을 작성해주세요.
    # 요약 가이드라인
    * [이전 대화 요약]이 있다면, 그 내용을 바탕으로 [대화 기록]의 새로운 정보를 자연스럽게 통합하여 하나의 업데이트된 요약을 만드세요.
    * [이전 대화 요약]이 없다면 (대화 초반), [대화 기록]만으로 첫 요약을 생성하세요.
    * 요약은 사용자와 AI의 상호작용을 객관적으로 기술하는 형태여야 합니다. (예: "사용자가 A 제품에 대해 문의함. AI는 B 기능을 설명하고 C 제품을 추천함.")
    * 핵심적인 내용 중심으로 간결하게 작성하며, 불필요한 미사여구나 반복은 피하세요.
    * 최종 요약문의 길이는 약 **{target_summary_tokens} 토큰** 내외가 되도록 노력해주세요. (정확히 맞출 필요는 없으나, 너무 길거나 짧지 않게 조절)
    # 입력 정보
    [이전 대화 요약]:
    {previous_summary}
    [대화 기록]:
    {conversation_history}
    # 업데이트된 통합 요약 ({target_summary_tokens} 토큰 내외):

  # 만족도 평가 프롬프트 (신규 추가)
  satisfaction_evaluation_prompt_template: |
    다음은 사용자 질문과 챗봇의 답변입니다. 아래 평가 기준에 따라 답변의 만족도를 1점에서 5점 사이로 평가하고, 각 항목별 점수와 간결한 평가 이유를 JSON 형식으로 제공해주세요.

    [평가 기준]
    - 관련성(Relevance): 질문의 의도에 얼마나 부합하는 답변인가? (1-5)
    - 정확성(Accuracy): 제공된 정보나 사실에 기반하여 얼마나 정확한가? 환각은 없는가? (1-5)
    - 완결성(Completeness): 질문에 대해 충분하고 만족스러운 정보를 제공하는가? (1-5)
    - 간결성(Conciseness): 불필요하게 길거나 장황하지 않고 핵심 정보를 잘 전달하는가? (1-5)
    - 어조(Tone): 데카트론 상담원으로서 전문적이고 친절한 어조인가? (1-5)
    - 종합 만족도(Overall): 위 항목들을 고려한 전반적인 만족도는? (1-5)

    [사용자 질문]
    {question}

    [챗봇 답변]
    {response}

    [평가 결과 (JSON 형식)]
    ```json
    {{
      "relevance_score": <점수>,
      "accuracy_score": <점수>,
      "completeness_score": <점수>,
      "conciseness_score": <점수>,
      "tone_score": <점수>,
      "overall_satisfaction_score": <점수>,
      "evaluation_reason": "<간결한 총평>"
    }}
    ```

  # 기타 프롬프트 요소 (필요 시 사용 - 변경 없음)
  rag_fallback_message: "- 관련된 문서 정보를 찾지 못했습니다."

