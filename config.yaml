    [1차 LLM 응답 (조건 기반 탐색)]
    (내부 사고: 사용자는 '가성비 좋은 텐트', '비바람 잘 막는 기능'을 원한다. 가족 캠핑 맥락 고려. 질문 유형: b. 조건 기반 탐색/추천 질문. num_results=1 로 제한하여 가장 적합한 후보 1개만 먼저 확인한다.)
